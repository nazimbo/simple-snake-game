name: Deploy to VPS
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy-vps
  cancel-in-progress: false
jobs:
  # No build step and no dependencies — the site is hand-written files served by
  # nginx. The one thing that can break in silence is index.html referencing a
  # script that no longer exists: the page still returns 200 and the game is
  # simply dead. scripts/check-assets.mjs catches exactly that.
  test:
    runs-on: ${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-assets.mjs

  deploy:
    needs: test
    runs-on: ${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      # The deploy key is bound on the VPS to /root/deploiement/porte.sh: rsync may only write
      # into this project's folder (the path is relative to it), and the only command is
      # "deployer", which validates the compose file, rebuilds, and checks every container
      # runs the freshly built image. Anything else is refused.
      - name: Sync project to VPS
        run: |
          rsync -az --delete \
            --exclude '.git' --exclude 'node_modules' --exclude 'dist' --exclude 'build' --exclude '.svelte-kit' \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" \
            ./ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:./"
      - name: Build and restart containers
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" deployer
      - name: Check the site end to end
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 https://snake.nazimbo.com/)
          echo "https://snake.nazimbo.com/ → $code"
          test "$code" = 200
